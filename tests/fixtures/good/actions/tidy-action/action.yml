# Positive fixture for the composite-action rules.
name: tidy-action
description: Fixture that satisfies every action rule.
inputs:
  target:
    description: Directory to tidy.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: rm -rf "$TARGET/build"
