# Positive fixture: digest-pinned image, explicit timeout, every input
# documented and used.
spec:
  inputs:
    runner_image:
      description: Digest-pinned image the job runs in.
      type: string
      default: "python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285"
    timeout_minutes:
      description: Per-job timeout in minutes.
      type: number
      default: 10
---
".base":
  image: $[[ inputs.runner_image ]]
  timeout: $[[ inputs.timeout_minutes ]] minutes

test:
  extends: ".base"
  script:
    - pytest
