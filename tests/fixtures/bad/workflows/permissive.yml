# Negative fixture: a workflow that grants write scopes nothing in it uses.
# Expected: permissions-unjustified-write for contents and id-token at
# workflow level, and permissions-write-all on the second job.
name: permissive
on: push

permissions:
  contents: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: make build

  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: write-all
    steps:
      - run: make publish
