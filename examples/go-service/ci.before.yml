# .github/workflows/ci.yml in a caller repository, written by hand.
#
# A Go service with private module dependencies. The interesting failure here
# is the coverage gate: `go tool cover -func | tail -1 | awk '{print $3}'`
# reads `85.4%` as the string "85.4%", and `[ "85.4%" -lt 70 ]` is a bash
# error that this script swallows, so the gate has never once failed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Private modules
        env:
          TOKEN: ${{ secrets.GOPRIVATE_TOKEN }}
        run: |
          go env -w GOPRIVATE=example.internal/*
          git config --global url."https://x-access-token:${TOKEN}@example.internal/".insteadOf "https://example.internal/"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "coverage $total"
          [ "$total" -ge 70 ] || echo "coverage below 70%"

      - name: Build
        run: go build ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
